# .github/workflows/ci.yml
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Covers the app, the ETL and both Workers in one pass. The Next build
      # only typechecks what it bundles, so without this the Workers could
      # break without CI noticing.
      - run: npm run cf:typecheck
      - run: npm run fetch-natural-earth
      - run: npm run build-maps
      # The unit tests price real quotes against the compiled bundles, so the
      # ETL has to have run before them.
      - run: npm run build-atlas
      - run: npm run build-package-cards
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run lighthouse

  # Validates both Wrangler configs — bindings, entrypoints, asset directory —
  # by bundling exactly as a real deploy would, without deploying and without
  # needing Cloudflare credentials.
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The frontend config points `[assets]` at `out/`, which must exist for
      # the dry run to resolve.
      - name: Build data, maps and the static export
        run: |
          npm run fetch-natural-earth
          npm run build-maps
          npm run build-atlas
          npm run build-package-cards
          npm run build

      - name: Validate both Worker configs
        run: npm run cf:check

  # Continuous deployment: only for pushes to main, and only after the tests
  # and the Worker dry-run pass, so a red build never ships.
  # Repository secrets needed: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
  # GOOGLE_PLACES_API_KEY (read at build time). OAuth client IDs/secrets and
  # other runtime keys live on the atlas-api Worker itself and persist across
  # deploys, so CI does not touch them.
  deploy:
    needs: [test, workers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build data, maps and the static export
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          npm run fetch-natural-earth
          npm run build-maps
          npm run build-atlas
          npm run build-package-cards
          npm run build
          test -f out/index.html

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: d1 migrations apply atlas --remote --env=""

      # API first: the frontend's service binding resolves atlas-api by name.
      - name: Deploy backend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --env=""

      # Sync OAuth and API keys from GitHub secrets to the backend Worker.
      # Empty/missing ones are skipped, so a Worker secret is never blanked.
      - name: Sync Worker secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET FACEBOOK_CLIENT_ID FACEBOOK_CLIENT_SECRET X_CLIENT_ID X_CLIENT_SECRET TRAVELPAYOUTS_TOKEN LITEAPI_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --env=""
            else
              echo "skip $name (not set in GitHub secrets)"
            fi
          done

      - name: Deploy frontend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=""
